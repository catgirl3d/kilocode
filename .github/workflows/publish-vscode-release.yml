# kilocode_change - new file
name: publish-vscode-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (leave empty to use <package.json version>-fork.<run number>)"
        required: false
        type: string
        default: ""
      notes:
        description: "Release notes override (leave empty to list CHANGELOG-FORK.md entries added since the previous release)"
        required: false
        type: string
        default: ""

concurrency:
  group: publish-vscode-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and Release VSIX
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Determine version, tag, and release notes
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            BASE="$(bun -e 'console.log((await Bun.file("packages/kilo-vscode/package.json").json()).version)')"
            VERSION="$BASE-fork.$GITHUB_RUN_NUMBER"
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building VSIX for version: $VERSION (tag: $TAG)"

          # Releases and tags are never replaced: stop before the build if this one is taken.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick another version or delete the release and its tag first."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Tag $TAG already exists on origin. Pick another version or delete the tag first."
            exit 1
          fi

          if [ -n "$INPUT_NOTES" ]; then
            echo "$INPUT_NOTES" > release_notes.md
            exit 0
          fi
          if [ ! -f "CHANGELOG-FORK.md" ]; then
            echo "Kilo Code Fork VSIX Build ($VERSION)" > release_notes.md
            exit 0
          fi

          PREV="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName,publishedAt --jq 'sort_by(.publishedAt) | last | .tagName // ""')"
          if [ -z "$PREV" ]; then
            cp CHANGELOG-FORK.md release_notes.md
            exit 0
          fi

          # Compare file contents at the previous release tag, not a commit range: rebases rewrite history.
          git fetch origin "+refs/tags/$PREV:refs/fork-release/prev" --no-tags
          git show "refs/fork-release/prev:CHANGELOG-FORK.md" > "$RUNNER_TEMP/changelog_prev.md" 2>/dev/null \
            || : > "$RUNNER_TEMP/changelog_prev.md"
          awk -v prev="$RUNNER_TEMP/changelog_prev.md" '
            BEGIN { while ((getline line < prev) > 0) old[line] = 1 }
            /^### / { head = $0; next }
            /^- / && !($0 in old) {
              if (head != "") {
                if (seen) print ""
                print head
                print ""
                head = ""
                seen = 1
              }
              print
            }
          ' CHANGELOG-FORK.md > "$RUNNER_TEMP/changelog_delta.md"

          echo "Changes since [$PREV]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$PREV):" > release_notes.md
          echo "" >> release_notes.md
          if [ -s "$RUNNER_TEMP/changelog_delta.md" ]; then
            cat "$RUNNER_TEMP/changelog_delta.md" >> release_notes.md
          else
            echo "No new CHANGELOG-FORK.md entries." >> release_notes.md
          fi

      - name: Install VSIX packager
        run: bun install -g @vscode/vsce

      - name: Setup Zig for Linux sandbox helpers
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: Build CLI binaries
        env:
          KILO_VERSION: ${{ steps.meta.outputs.version }}
        run: ./packages/opencode/script/build.ts

      - name: Build VSIX
        working-directory: packages/kilo-vscode
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          KILO_VERSION: ${{ steps.meta.outputs.version }}
          CLI_DIST_DIR: ../../packages/opencode/dist
        run: |
          bun run script/build.ts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" \
            packages/kilo-vscode/out/kilo-vscode-linux-x64.vsix \
            packages/kilo-vscode/out/kilo-vscode-win32-x64.vsix \
            --target "$GITHUB_SHA" \
            --title "$TAG (Fork)" \
            --latest \
            --notes-file release_notes.md \
            --repo "$GITHUB_REPOSITORY"
