# kilocode_change - new file
name: test-cli

# Fork-only replacement for the upstream `test` workflow, which runs only in
# Kilo-Org/kilocode. Runs the CLI/backend unit tests on Linux for pushes to main
# and pull requests that touch CLI or shared packages, and on manual dispatch.

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "!packages/kilo-vscode/**"
      - "!packages/kilo-docs/**"
      - "!packages/kilo-jetbrains/**"
      - "script/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/actions/**"
      - ".github/workflows/test-cli.yml"
  pull_request:
    paths:
      - "packages/**"
      - "!packages/kilo-vscode/**"
      - "!packages/kilo-docs/**"
      - "!packages/kilo-jetbrains/**"
      - "script/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/actions/**"
      - ".github/workflows/test-cli.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    name: cli (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Linux sandbox helper
        uses: ./.github/actions/setup-linux-sandbox

      - name: Configure git identity
        run: |
          git config --global user.email "kilo-maintainer[bot]@users.noreply.github.com"
          git config --global user.name "kilo-maintainer[bot]"

      - name: Run CLI unit tests
        run: bun turbo test:ci --output-logs=errors-only --log-order=grouped --log-prefix=task --filter='@kilocode/cli'
        env:
          KILO_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
          KILO_TEST_FILE_TIMEOUT: "600000"
